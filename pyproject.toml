[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-report-generator"
version = "0.1.0"
description = "Multi-agent research and cited report generation with LangGraph, source verification, and a deterministic demo mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThinkNovus Technologies" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "langgraph>=1.2,<2.0",
]

[project.optional-dependencies]
search = ["tavily-python>=0.7,<1.0"]
openai = ["openai>=2.0,<3.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0", "pytest-cov>=5.0,<7.0", "ruff>=0.9,<1.0"]
all = ["tavily-python>=0.7,<1.0", "openai>=2.0,<3.0"]

[project.scripts]
research-report = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
